[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastface"
version = "0.1.0"
description = "CPU-efficient face age and gender training pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "pillow",
  "pyyaml",
  "onnx",
  "onnxruntime",
  "onnxscript",
  "torch",
  "torchvision",
  "timm",
  "tqdm",
  "openpyxl",
]

[project.optional-dependencies]
pipeline = [
  "opencv-python>=4.5.0",
  "uniface[cpu]>=3.7.1",
]

[tool.setuptools]
package-dir = {"" = "packages"}

[tool.setuptools.packages.find]
where = ["packages"]
