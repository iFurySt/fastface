seed: 20260730

model:
  name: torchvision_age_gender
  backbone: efficientnet_v2_s
  pretrained: true
  dropout: 0.2

data:
  manifests:
    - data/manifests/fairface.jsonl
    - data/manifests/utkface.jsonl
  input_size: 128
  batch_size: 144
  num_workers: 12
  age_sigma: 2.0

loss:
  gender_weight: 4.0
  age_weight: 0.5

train:
  epochs: 40
  lr: 0.001
  weight_decay: 0.01
  amp: true
  output_dir: runs/efficientnet_v2_s_128_gender_priority_real_fairface_utkface
