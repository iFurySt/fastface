seed: 20260730

model:
  name: mobilenetv3_age_gender
  variant: small
  pretrained: true
  dropout: 0.2

data:
  manifests:
    - data/manifests/fairface.jsonl
    - data/manifests/utkface.jsonl
    - data/manifests/imdb_clean.jsonl
  input_size: 112
  batch_size: 384
  num_workers: 12
  age_sigma: 2.0
  face_crop_margin: 0.2
  sample_limits:
    train:
      imdb-clean: 90000
    val:
      imdb-clean: 10954

loss:
  gender_weight: 2.0
  age_weight: 1.0

train:
  epochs: 40
  lr: 0.001
  weight_decay: 0.01
  amp: true
  output_dir: runs/mobilenetv3_small112_imdb_source_balanced_facecrop_real_fairface_utkface
