seed: 20260730

model:
  name: mobilenetv3_age_gender
  variant: large
  pretrained: true
  dropout: 0.2

data:
  manifests:
    - data/manifests/fairface.jsonl
    - data/manifests/utkface.jsonl
    - data/manifests/imdb_clean.jsonl
  input_size: 128
  batch_size: 256
  num_workers: 12
  age_sigma: 2.0
  face_crop_margin: 0.2
  sample_limits:
    train:
      imdb-clean: 90000
    val:
      imdb-clean: 10954

loss:
  gender_weight: 4.0
  age_weight: 0.5

distillation:
  enabled: true
  teacher_checkpoint: runs/efficientnet_v2_s_128_imdb_source_balanced_gender_priority_real_fairface_utkface/best.pt
  teacher_config: runs/efficientnet_v2_s_128_imdb_source_balanced_gender_priority_real_fairface_utkface/config.resolved.yaml
  temperature: 2.0
  gender_weight: 0.2
  age_weight: 0.0

train:
  epochs: 40
  lr: 0.001
  weight_decay: 0.01
  amp: true
  output_dir: runs/mobilenetv3_large128_imdb_source_balanced_distill_gender_priority_efficientnet_v2_s_imdb_fairface_utkface
