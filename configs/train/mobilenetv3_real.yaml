seed: 20260730

model:
  name: mobilenetv3_age_gender
  variant: large
  pretrained: true
  dropout: 0.2

data:
  manifests:
    - data/manifests/fairface.jsonl
    - data/manifests/utkface.jsonl
  input_size: 128
  batch_size: 256
  num_workers: 12
  age_sigma: 2.0

loss:
  gender_weight: 2.0
  age_weight: 1.0

train:
  epochs: 40
  lr: 0.001
  weight_decay: 0.01
  amp: true
  output_dir: runs/mobilenetv3_real_fairface_utkface
